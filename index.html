<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blackstone Tech</title>
  <meta name="description" content="Innovate. Secure. Transform.">
  <meta property="og:title" content="Blackstone Tech">
  <meta property="og:description" content="Innovate. Secure. Transform.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://images.unsplash.com/photo-1451187580459-43490279c0fa?fm=jpg&q=70&w=1200&auto=format&fit=crop">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Playfair+Display&family=Source+Sans+3&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: "Source Sans 3", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero {
      flex: 1;
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      text-align: center;
      padding: 24px;
      /* Change the address inside url() to use another image */
      background:
        linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
        url("https://images.unsplash.com/photo-1451187580459-43490279c0fa?fm=jpg&q=70&w=1920&auto=format&fit=crop")
        center / cover no-repeat,
        #0b1626;
    }

    .logo {
      font-family: Montserrat, sans-serif;
      font-size: clamp(18px, 3vw, 28px);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .logo a { color: inherit; text-decoration: none; }

    .tagline {
      margin: auto;
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 400;
      font-size: clamp(32px, 6vw, 62px);
      line-height: 1.2;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }

    footer {
      padding: 40px 24px;
      text-align: center;
      font-size: 14px;
      color: #969696;
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="logo"><a href="/">Blackstone Tech</a></div>
    <h1 class="tagline">Innovate. Secure. Transform.</h1>
  </header>

  <footer>
    Copyright &copy; 2026 Blackstone Tech - All Rights Reserved.
  </footer>
</body>
</html>
